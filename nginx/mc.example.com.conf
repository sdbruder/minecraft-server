# Read-only Minecraft dashboard (https://mc.example.com).
#
# The app listens on 127.0.0.1:8080 and does its own HTTP Basic auth; nginx only
# terminates TLS and proxies. The wildcard certificate *.example.com already
# covers this name. The exact server_name below wins over the existing
# `*.example.com` catch-all block.

server {
    listen 80;
    listen [::]:80;
    server_name mc.example.com;
    return 302 https://mc.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mc.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/mc.example.com.access.log;
    error_log  /var/log/nginx/mc.example.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
